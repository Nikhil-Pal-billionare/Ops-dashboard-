    }
    h += "</section></div>";
    root.innerHTML = h;
    bindData(root);
  }

  // ---------- upsert (dedupe) ----------
  // growth: one row per client + date. Provided fields overwrite, missing fields keep their old value.
  function upsertMetric(rec) {
    for (var i = 0; i < state.metrics.length; i++) {
      var m = state.metrics[i];
      if (m.clientId === rec.clientId && m.date === rec.date) {
        METRIC_FIELDS.forEach(function (f) { if (rec[f] !== undefined) m[f] = rec[f]; });
        return "updated";
      }
    }
    var fresh = { id: rec.id, clientId: rec.clientId, date: rec.date };
    METRIC_FIELDS.forEach(function (f) { if (rec[f] !== undefined) fresh[f] = rec[f]; });
    state.metrics.push(fresh);
    return "added";
  }

  // ---------- data actions ----------
  function bindData(root) {
    root.querySelector("#addClient").addEventListener("click", function () {
      var el = root.querySelector("#newClient");
      var name = el.value.trim();
      if (!name) { el.focus(); return; }
      state.clients.push({ id: uid(), name: name });
      scheduleSave(); renderAll();
    });
    root.querySelector("#newClient").addEventListener("keydown", function (e) { if (e.key === "Enter") root.querySelector("#addClient").click(); });
    root.querySelector("#addMetric").addEventListener("click", function () {
      var cid = root.querySelector("#mClient").value;
      if (!cid) { alert("Pehle client add karo."); return; }
      var date = root.querySelector("#mDate").value || todayStr();
      var mrec = { id: uid(), clientId: cid, date: date };
      [["impressions", "#mImp"], ["clicks", "#mClk"], ["outbound", "#mOut"], ["saves", "#mSav"], ["engagement", "#mEng"], ["totalAud", "#mTA"], ["engagedAud", "#mEA"]].forEach(function (pair) {
        var el = root.querySelector(pair[1]);
        if (el && String(el.value).trim() !== "") mrec[pair[0]] = num(el.value);
      });
      var res = upsertMetric(mrec);
      scheduleSave(); renderAll();
      if (res === "updated") setStatus("Is client ki us date ki entry update ho gayi (double nahi hui)");
    });
    root.querySelector("#addAud").addEventListener("click", function () {
      var cid = root.querySelector("#aClient").value;
      if (!cid) { alert("Pehle client add karo."); return; }
      var from = root.querySelector("#aFrom").value, to = root.querySelector("#aTo").value;
      if (!from || !to || from > to) { alert("From aur To date sahi daalo (From, To se pehle honi chahiye)."); return; }
      var ta = String(root.querySelector("#aTotal").value).trim(), ea = String(root.querySelector("#aEng").value).trim();
      if (ta === "" && ea === "") { root.querySelector("#aTotal").focus(); return; }
      var hit = null;
      state.audience.forEach(function (a) { if (a.clientId === cid && a.from === from && a.to === to) hit = a; });
      if (!hit) { hit = { id: uid(), clientId: cid, from: from, to: to }; state.audience.push(hit); }
      if (ta !== "") hit.totalAud = num(ta);
      if (ea !== "") hit.engagedAud = num(ea);
      scheduleSave(); renderAll();
    });
    root.querySelectorAll("[data-delaud]").forEach(function (b) {
      b.addEventListener("click", function () {
        var id = b.getAttribute("data-delaud");
        state.audience = state.audience.filter(function (a) { return a.id !== id; });
        scheduleSave(); renderAll();
      });
    });
    root.querySelectorAll("[data-delclient]").forEach(function (b) {
      b.addEventListener("click", function () {
        var id = b.getAttribute("data-delclient");
        if (!confirm("Is client aur uski saari growth entries delete karni hain?")) return;
        state.clients = state.clients.filter(function (c) { return c.id !== id; });
        state.metrics = state.metrics.filter(function (m) { return m.clientId !== id; });
        state.audience = state.audience.filter(function (a) { return a.clientId !== id; });
        scheduleSave(); renderAll();
      });
    });
    root.querySelectorAll("[data-delmetric]").forEach(function (b) {
      b.addEventListener("click", function () {
        var id = b.getAttribute("data-delmetric");
        state.metrics = state.metrics.filter(function (m) { return m.id !== id; });
        scheduleSave(); renderAll();
      });
    });
    root.querySelector("#csvMetrics").addEventListener("change", function (e) { importCsv(e.target.files[0]); e.target.value = ""; });
    root.querySelector("#expMetrics").addEventListener("click", exportCsv);
  }

  // ---------- CSV ----------
  function parseCsv(text) {
    var rows = [], row = [], cur = "", q = false;
    for (var i = 0; i < text.length; i++) {
      var ch = text[i];
      if (q) {
        if (ch === '"' && text[i + 1] === '"') { cur += '"'; i++; }
        else if (ch === '"') q = false;
        else cur += ch;
      } else if (ch === '"') q = true;
      else if (ch === ",") { row.push(cur); cur = ""; }
      else if (ch === "\n" || ch === "\r") {
        if (ch === "\r" && text[i + 1] === "\n") i++;
        row.push(cur); cur = "";
        if (row.length > 1 || row[0] !== "") rows.push(row);
        row = [];
      } else cur += ch;
    }
    if (cur !== "" || row.length) { row.push(cur); rows.push(row); }
    return rows;
  }
  function csvCell(v) {
    v = String(v == null ? "" : v);
    return /[",\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
  }
  function normDate(s) {
    s = String(s || "").trim();
    var m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
    if (m) return m[1] + "-" + ("0" + m[2]).slice(-2) + "-" + ("0" + m[3]).slice(-2);
    var d = new Date(s);
    return isNaN(d.getTime()) ? "" : d.toISOString().slice(0, 10);
  }
  function importCsv(file) {
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      var rows = parseCsv(String(reader.result));
      if (rows.length < 2) { alert("CSV me data rows nahi mile."); return; }
      var head = rows[0].map(function (h) { return h.trim().toLowerCase(); });
      function col(name) { return head.indexOf(name); }
      var added = 0, updated = 0, skipped = 0;
      var ci = col("client"), di = col("date");
      if (ci < 0 || di < 0) { alert("CSV me 'client' aur 'date' columns chahiye."); return; }
      rows.slice(1).forEach(function (r) {
        var name = (r[ci] || "").trim(), date = normDate(r[di]);
        if (!name || !date) { skipped++; return; }
        var client = state.clients.filter(function (c) { return c.name.toLowerCase() === name.toLowerCase(); })[0];
        if (!client) { client = { id: uid(), name: name }; state.clients.push(client); }
        var rec = { id: uid(), clientId: client.id, date: date };
        var map = { impressions: "impressions", clicks: "clicks", outbound: "outbound clicks", saves: "saves", engagement: "engagement", totalAud: "total audience", engagedAud: "engaged audience" };
        var any = false;
        Object.keys(map).forEach(function (k) {
          var ix = col(map[k]);
          if (ix < 0) ix = col(k.toLowerCase());
          if (ix >= 0 && String(r[ix] == null ? "" : r[ix]).trim() !== "") { rec[k] = num(r[ix]); any = true; }
        });
        if (!any) { skipped++; return; }
        var mres = upsertMetric(rec);
        if (mres === "updated") updated++; else added++;
      });
      scheduleSave(); renderAll();
      alert(added + " nayi rows add hui, " + updated + " purani update hui, " + skipped + " skip hui (duplicate ya galat).");
    };
    reader.readAsText(file);
  }
  function exportCsv() {
    var lines = ["client,date,impressions,clicks,outbound clicks,saves,engagement,total audience,engaged audience"];
    state.metrics.forEach(function (m) {
      lines.push([clientName(m.clientId), m.date, m.impressions, m.clicks, m.outbound, m.saves, m.engagement, m.totalAud, m.engagedAud].map(function (v) { return v == null ? "" : v; }).map(csvCell).join(","));
    });
    var filename = "client-growth-" + todayStr() + ".csv";
    try {
      var blob = new Blob([lines.join("\n")], { type: "text/csv;charset=utf-8" });
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = filename;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
    } catch (e) { setStatus("Download failed"); }
  }

  // ---------- render / tabs ----------
  var played = {};
  function renderCurrent(play) {
    if (ROLE !== "admin") return;
    var p = !!play && motionOK;
    if (ui.tab === "overview") renderOverview(p);
    else if (ui.tab === "clients") renderClients(p);
    else if (ui.tab === "data") renderData();
  }
  // called after data changes
  function renderAll() {
    var first = !played[ui.tab] && state.metrics.length > 0;
    if (first) played[ui.tab] = true;
    renderCurrent(first);
  }
  var lastW = window.innerWidth;
  var rzTimer = null;
  window.addEventListener("resize", function () {
    if (window.innerWidth === lastW) return; // mobile keyboard changes only height
    lastW = window.innerWidth;
    clearTimeout(rzTimer);
    rzTimer = setTimeout(function () { if (ui.tab === "overview" || ui.tab === "clients") renderCurrent(false); }, 220);
  });

  // ---------- roles, routing, 404 ----------
  var ROLE = null;
  var ALL_TABS = ["overview", "clients", "data", "team"];
  var TABS = { admin: ALL_TABS, employee: ["team"] };
  function allowed(t) { return !!ROLE && TABS[ROLE].indexOf(t) > -1; }

  function route() {
    if (!ROLE) return;
    var t = (location.hash || "").replace(/^#\/?/, "");
    if (!t) t = ROLE === "admin" ? "overview" : "team";
    var ok = allowed(t);
    ALL_TABS.forEach(function (x) {
      var el = $("tab-" + x);
      if (el) el.classList.toggle("hidden", !(ok && x === t));
    });
    document.querySelectorAll("#tabs button").forEach(function (b) {
      b.setAttribute("aria-selected", ok && b.getAttribute("data-tab") === t ? "true" : "false");
    });
    $("view-404").classList.toggle("hidden", ok);
    if (ok) {
      ui.tab = t;
      if (t === "team" && window.teamTabOpen) window.teamTabOpen(ROLE);
      else if (ROLE === "admin") {
        var first = !played[t] && state.metrics.length > 0;
        if (first) played[t] = true;
        renderCurrent(first);
      }
    }
  }
  $("tabs").addEventListener("click", function (e) {
    var b = e.target.closest("button[data-tab]");
    if (!b) return;
    var h = "#/" + b.getAttribute("data-tab");
    if (location.hash === h) route(); else location.hash = h;
  });
  window.addEventListener("hashchange", route);

  // ---------- login gate ----------
  function setKey(k) {
    try { if (k) localStorage.setItem(KEY_LS, k); else localStorage.removeItem(KEY_LS); } catch (e) {}
  }
  function tapi(action, body) {
    return fetch("/api/team", {
      method: "POST", credentials: "same-origin",
      headers: { "Content-Type": "application/json", "x-dashboard-key": getKey() },
      body: JSON.stringify(Object.assign({ action: action }, body || {}))
    }).then(function (r) { return r.json().then(function (d) { return { ok: r.ok, status: r.status, d: d }; }); });
  }
  function checkAdmin() {
    return fetch("/api/state", { headers: apiHeaders() })
      .then(function (r) { if (r.status === 401) return "bad"; return r.ok ? "ok" : "err"; })
      .catch(function () { return "err"; });
  }
  function gateView(msg) {
    $("app").classList.add("hidden");
    var g = $("gate");
    g.classList.remove("hidden");
    g.innerHTML = '<div class="hero">' +
      '<h1><img class="logo" src="/favicon-192.png" alt="">Ops Dashboard</h1>' +
      '<p class="note">Employee: email + password. Admin: email khali chhodo, sirf admin password daalo.</p>' +
      '<label>Email (employee)<input id="g-e" type="email" autocapitalize="none" autocomplete="username"></label>' +
      '<label>Password<input id="g-p" type="password" autocomplete="current-password"></label>' +
      '<button class="btn primary" id="g-go">Login</button>' +
      '<div class="err" id="g-er"></div></div>';
    g.querySelector("#g-er").textContent = msg || "";
    var btn = g.querySelector("#g-go");
    function submit() {
      var em = g.querySelector("#g-e").value.trim(), pw = g.querySelector("#g-p").value, p;
      if (!pw) return;
      btn.disabled = true;
      if (!em) {
        setKey(pw);
        p = checkAdmin().then(function (s) {
          if (s === "ok") return { admin: true };
          setKey("");
          throw new Error(s === "bad" ? "Password galat hai." : "Server se connect nahi hua.");
        });
      } else {
        setKey("");
        p = tapi("login", { email: em, password: pw }).then(function (x) {
          if (x.status === 403) throw new Error("Is device ka access band hai.");
          if (!x.ok) throw new Error("Email ya password galat hai.");
          return tapi("boot");
        }).then(function (x) {
          if (!x.ok || x.d.admin) throw new Error("Login nahi hua, dobara try karo.");
          return x.d;
        });
      }
      p.then(enter).catch(function (err) { gateView(err.message); });
    }
    btn.onclick = submit;
    g.addEventListener("keydown", function (e) { if (e.key === "Enter") submit(); });
  }
  function enter(d) {
    ROLE = d.admin ? "admin" : "employee";
    var g = $("gate");
    g.classList.add("hidden");
    g.innerHTML = "";
    $("app").classList.remove("hidden");
    $("logout").classList.remove("hidden");
    if (ROLE === "employee") {
      // other tabs are removed from the page completely, data never loads
      ["overview", "clients", "data"].forEach(function (t) {
        var s = $("tab-" + t); if (s) s.remove();
        var b = document.querySelector('#tabs button[data-tab="' + t + '"]'); if (b) b.remove();
      });
      $("apptitle").textContent = "GrowMyPin Studio";
      setStatus(d.email || "");
    } else {
      startAdmin();
    }
    route();
  }
  $("logout").addEventListener("click", function (e) {
    e.preventDefault();
    tapi("logout").catch(function () {}).then(function () {
      setKey("");
      if (ROLE === "admin" && store) { try { localStorage.removeItem(LS_KEY); } catch (x) {} }
      location.hash = "";
      location.reload();
    });
  });
  function bootGate() {
    var haveKey = !!getKey();
    (haveKey ? checkAdmin() : Promise.resolve("none")).then(function (s) {
      if (s === "ok") return enter({ admin: true });
      if (s === "bad") setKey("");
      return tapi("boot").then(function (x) {
        if (x.ok && !x.d.admin) return enter(x.d);
        gateView();
      });
    }).catch(function () { gateView("Server se connect nahi hua."); });
  }

  // ---------- admin boot (runs only after admin is verified) ----------
  function startAdmin() {
    uiRead();
    loadState(lsRead());
    setStatus(state.clients.length || state.metrics.length ? "Loaded from this browser" : "Empty. Start from the Add data tab.");
    cloudBoot();
  }
  function cloudBoot() {
    var key = getKey();
    if (!key) {
      key = window.prompt("Dashboard password:") || "";
      if (!key) { setStatus("Password required for cloud sync. Using this browser."); return; }
      try { localStorage.setItem(KEY_LS, key); } catch (e) {}
    }
    fetch("/api/state", { headers: apiHeaders() }).then(function (r) {
      if (r.status === 401) {
        try { localStorage.removeItem(KEY_LS); } catch (e) {}
        setStatus("Wrong password. Reload and try again.");
        return null;
      }
      if (!r.ok) throw new Error("http " + r.status);
      return r.json();
    }).then(function (res) {
      if (!res) return;
      store = true;
      var cloud = res.data;
      if (cloud && typeof cloud === "object") {
        var hasLocal = state.clients.length || state.metrics.length || state.finance.length;
        var cloudCount = (cloud.metrics || []).length + (cloud.finance || []).length;
        var localCount = state.metrics.length + state.finance.length;
        if (!hasLocal || cloudCount >= localCount) { loadState(cloud); lsWrite(); renderAll(); }
      }
      setStatus("Cloud sync on");
      if (state.clients.length || state.metrics.length || state.finance.length) scheduleSave();
    }).catch(function () { setStatus("Cloud sync unavailable. Using this browser."); });
  }
  bootGate();
})();
</script>
<script src="pinwriter.js"></script>
<script src="team-mgmt.js"></script>
