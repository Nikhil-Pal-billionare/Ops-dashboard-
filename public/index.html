<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nikhil Ops Dashboard</title>
<style>
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  --ink: #14213D;
  --paper: #F7F7F5;
  --panel: #FFFFFF;
  --line: #DCDCD6;
  --muted: #6B7280;
  --pin: #C8102E;
  --gain: #1B7F5C;
  --loss: #B45309;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ink: #E8ECF5; --paper: #0F1729; --panel: #16203A; --line: #2A3555;
    --muted: #94A3B8; --pin: #F0566B; --gain: #34C58E; --loss: #F59E0B;
  }
}
:root[data-theme="dark"] {
  --ink: #E8ECF5; --paper: #0F1729; --panel: #16203A; --line: #2A3555;
  --muted: #94A3B8; --pin: #F0566B; --gain: #34C58E; --loss: #F59E0B;
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  font-variant-numeric: tabular-nums;
}
.wrap { max-width: 1100px; margin: 0 auto; padding: 16px 16px 64px; }
header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; padding: 8px 0 16px; }
h1 { font-size: 20px; margin: 0; font-weight: 700; letter-spacing: -0.01em; }
.status { font-size: 12px; color: var(--muted); }
nav { display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto; margin-bottom: 20px; }
nav button {
  background: none; border: 0; padding: 10px 14px; font: inherit; color: var(--muted);
  cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap;
}
nav button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--pin); font-weight: 600; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--pin); outline-offset: 2px; }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 16px; }
select, input, .btn {
  font: inherit; color: var(--ink); background: var(--panel);
  border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px;
}
.btn { cursor: pointer; }
.btn.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.btn.danger { color: var(--pin); }
.hero { display: grid; grid-template-columns: 1fr; gap: 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); margin-bottom: 20px; }
.stat { padding: 14px 0; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.stat:last-child { border-bottom: 0; }
.stat .k { color: var(--muted); font-size: 13px; }
.stat .v { font-size: 22px; font-weight: 700; }
.stat .v.pin { color: var(--pin); }
.stat .v.gain { color: var(--gain); }
.stat .v.loss { color: var(--loss); }
@media (min-width: 720px) {
  .hero { grid-template-columns: repeat(3, 1fr); }
  .stat { flex-direction: column; align-items: flex-start; border-bottom: 0; border-right: 1px solid var(--line); padding: 16px 20px; }
  .stat:last-child { border-right: 0; }
}
.chartbox { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 16px; margin-bottom: 20px; }
.chartbox h2 { font-size: 14px; margin: 0 0 12px; font-weight: 600; }
svg text { fill: var(--muted); font-size: 11px; }
.chartwrap { position: relative; touch-action: pan-y; }
.chartwrap svg { display: block; }
.guide { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 3 3; pointer-events: none; }
.hdot { pointer-events: none; stroke: var(--panel); stroke-width: 2; }
.tip {
  position: absolute; z-index: 5; pointer-events: none; min-width: 150px; max-width: 240px;
  background: var(--panel); color: var(--ink); border: 1px solid var(--line);
  border-radius: 8px; padding: 8px 10px; font-size: 12px; line-height: 1.5;
  box-shadow: 0 4px 14px rgba(0,0,0,0.18);
}
.tip .td { font-weight: 700; margin-bottom: 4px; }
.tip .tr { display: flex; justify-content: space-between; gap: 14px; align-items: center; }
.tip .tr i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 6px; }
.tip .tr b { font-weight: 700; }
.hidden-tip { display: none; }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); margin-bottom: 8px; flex-wrap: wrap; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
.tablewrap { overflow-x: auto; border: 1px solid var(--line); background: var(--panel); border-radius: 8px; margin-bottom: 20px; }
table { border-collapse: collapse; width: 100%; min-width: 640px; }
th, td { text-align: right; padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
th { font-size: 12px; color: var(--muted); font-weight: 600; }
tr:last-child td { border-bottom: 0; }
tr.total td { font-weight: 700; background: color-mix(in srgb, var(--line) 35%, transparent); }
.formgrid { display: grid; grid-template-columns: 1fr; gap: 10px; margin-bottom: 12px; }
@media (min-width: 720px) { .formgrid { grid-template-columns: repeat(4, 1fr); } }
label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
h3 { margin: 24px 0 10px; font-size: 15px; }
.empty { padding: 28px; text-align: center; color: var(--muted); }
.note { font-size: 12px; color: var(--muted); margin: 8px 0; }
.rowbtn { background: none; border: 0; color: var(--muted); cursor: pointer; font: inherit; padding: 2px 6px; }
.rowbtn:hover { color: var(--pin); }
.hidden { display: none; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div id="gate" class="wrap"></div>
<div class="wrap hidden" id="app">
  <header>
    <h1>Ops Dashboard</h1>
    <span class="status" id="status">Loading data...</span>
    <a href="#" id="logout" class="note hidden">Logout</a>
  </header>

  <nav role="tablist" id="tabs">
    <button role="tab" data-tab="overview" aria-selected="true">Overview</button>
    <button role="tab" data-tab="clients" aria-selected="false">Clients</button>
    <button role="tab" data-tab="business" aria-selected="false">Business</button>
    <button role="tab" data-tab="data" aria-selected="false">Add data</button>
    <button role="tab" data-tab="team" aria-selected="false">Team Management</button>
  </nav>

  <section id="tab-overview"></section>
  <section id="tab-clients" class="hidden"></section>
  <section id="tab-business" class="hidden"></section>
  <section id="tab-data" class="hidden"></section>
  <section id="tab-team" class="hidden"></section>
  <section id="view-404" class="hidden" style="text-align:center;padding:80px 16px">
    <h1 style="font-size:48px">404</h1>
    <p class="note">This page could not be found.</p>
  </section>
</div>

<script>
(function () {
  "use strict";

  // ---------- state ----------
  var state = { clients: [], metrics: [], finance: [], audience: [] };
  var ui = { tab: "overview", period: "all", clientFilter: "all", bizFilter: "all", from: "", to: "" };
  var store = null;      // db doc ref if available
  var saveTimer = null;
  var LS_KEY = "ops_dashboard_v1";
  var KEY_LS = "ops_dashboard_key";

  function uid() { return Math.random().toString(36).slice(2, 10); }
  function num(v) { var n = parseFloat(v); return isFinite(n) ? n : 0; }
  function fmt(n) {
    n = num(n);
    var a = Math.abs(n);
    if (a >= 10000000) return (n / 10000000).toFixed(2) + " Cr";
    if (a >= 100000) return (n / 100000).toFixed(2) + " L";
    if (a >= 1000) return (n / 1000).toFixed(1) + "K";
    return String(Math.round(n * 100) / 100);
  }
  function money(n) { return "Rs " + fmt(n); }
  function pct(n) { return (Math.round(n * 100) / 100) + "%"; }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function setStatus(t) { document.getElementById("status").textContent = t; }

  // ---------- persistence ----------
  function lsRead() {
    try { var raw = localStorage.getItem(LS_KEY); return raw ? JSON.parse(raw) : null; } catch (e) { return null; }
  }
  function lsWrite() {
    try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) { /* ignore */ }
  }
  function apiHeaders() {
    return { "Content-Type": "application/json", "x-dashboard-key": getKey() };
  }
  function getKey() {
    try { return localStorage.getItem(KEY_LS) || ""; } catch (e) { return ""; }
  }
  function scheduleSave() {
    lsWrite();
    if (!store) { setStatus("Saved on this browser only"); return; }
    clearTimeout(saveTimer);
    setStatus("Saving...");
    saveTimer = setTimeout(function () {
      fetch("/api/state", { method: "POST", headers: apiHeaders(), body: JSON.stringify({ data: state }) })
        .then(function (r) {
          if (r.status === 401) { setStatus("Wrong password. Reload and try again."); try { localStorage.removeItem(KEY_LS); } catch (e) {} return; }
          if (!r.ok) throw new Error("http " + r.status);
          setStatus("Saved");
        })
        .catch(function () { setStatus("Cloud save failed. Saved on this browser."); });
    }, 700);
  }
  function loadState(obj) {
    if (obj && typeof obj === "object") {
      state.clients = Array.isArray(obj.clients) ? obj.clients : [];
      state.metrics = Array.isArray(obj.metrics) ? obj.metrics : [];
      state.finance = Array.isArray(obj.finance) ? obj.finance : [];
      state.audience = Array.isArray(obj.audience) ? obj.audience : [];
    }
  }

  // ---------- date helpers ----------
  function todayStr() { return new Date().toISOString().slice(0, 10); }
  function addDays(dateStr, n) {
    var d = new Date(dateStr + "T00:00:00Z");
    d.setUTCDate(d.getUTCDate() + n);
    return d.toISOString().slice(0, 10);
  }
  // returns {from, to} as YYYY-MM-DD inclusive. "N days" = today and the N-1 days before it.
  function range() {
    if (ui.period === "custom") return { from: ui.from || "0000-00-00", to: ui.to || "9999-99-99" };
    if (ui.period === "all") return { from: "0000-00-00", to: "9999-99-99" };
    var n = parseInt(ui.period, 10);
    var t = todayStr();
    return { from: addDays(t, -(n - 1)), to: t };
  }
  function inRange(dateStr) {
    var r = range();
    return dateStr >= r.from && dateStr <= r.to;
  }
  function monthKey(dateStr) { return String(dateStr).slice(0, 7); }

  // ---------- aggregation ----------
  function filteredMetrics(clientId) {
    return state.metrics.filter(function (m) {
      return inRange(m.date) && (clientId === "all" || m.clientId === clientId);
    });
  }
  function sumMetrics(rows) {
    var t = { impressions: 0, clicks: 0, outbound: 0, saves: 0, engagement: 0 };
    rows.forEach(function (r) {
      t.impressions += num(r.impressions);
      t.clicks += num(r.clicks);
      t.outbound += num(r.outbound);
      t.saves += num(r.saves);
      t.engagement += num(r.engagement);
    });
    t.ctr = t.impressions ? (t.clicks / t.impressions) * 100 : 0;
    t.engRate = t.impressions ? (t.engagement / t.impressions) * 100 : 0;
    var days = {};
    rows.forEach(function (r) { days[r.date] = 1; });
    var dn = Object.keys(days).length;
    t.days = dn;
    t.avgImp = dn ? t.impressions / dn : 0;
    return t;
  }
  function filteredFinance() {
    return state.finance.filter(function (f) {
      return inRange(f.date) && (ui.bizFilter === "all" || (f.source || "Other") === ui.bizFilter);
    });
  }
  function bizList() {
    var seen = {}, out = [];
    state.finance.forEach(function (f) {
      var k = f.source || "Other";
      if (!seen[k]) { seen[k] = 1; out.push(k); }
    });
    return out.sort();
  }
  function sumFinance(rows) {
    var rev = 0, exp = 0;
    rows.forEach(function (r) {
      if (r.type === "revenue") rev += num(r.amount); else exp += num(r.amount);
    });
    return { revenue: rev, expenses: exp, profit: rev - exp, margin: rev ? ((rev - exp) / rev) * 100 : 0 };
  }
  function clientName(id) {
    for (var i = 0; i < state.clients.length; i++) if (state.clients[i].id === id) return state.clients[i].name;
    return "Unknown";
  }

  // ---------- charts (inline SVG) ----------
  function lineChart(series, height, extraHover) {
    // series: [{label, color, points:[{x:label, y:number}]}], shared x labels
    var W = 720, H = height || 240, pl = 44, pr = 12, pt = 10, pb = 26;
    var xs = [];
    series.forEach(function (s) { s.points.forEach(function (p) { if (xs.indexOf(p.x) < 0) xs.push(p.x); }); });
    xs.sort();
    if (!xs.length) return '<div class="empty">No data in this range yet.</div>';
    var maxY = 0;
    series.forEach(function (s) { s.points.forEach(function (p) { if (p.y > maxY) maxY = p.y; }); });
    if (maxY <= 0) maxY = 1;
    function X(i) { return pl + (xs.length === 1 ? (W - pl - pr) / 2 : (i * (W - pl - pr)) / (xs.length - 1)); }
    function Y(v) { return pt + (H - pt - pb) * (1 - v / maxY); }
    // payload for the hover tooltip: one entry per x, values for every series
    var payload = xs.map(function (x, i) {
      var vals = series.map(function (s) {
        var hit = null;
        s.points.forEach(function (p) { if (p.x === x) hit = p.y; });
        return { label: s.label, color: s.color, y: hit, py: hit == null ? null : Y(hit) };
      });
      (extraHover || []).forEach(function (s) {
        var hit = null;
        s.points.forEach(function (p) { if (p.x === x) hit = p.y; });
        vals.push({ label: s.label, color: s.color, y: hit, py: null, noDot: true });
      });
      return { x: x, px: X(i), v: vals };
    });
    var out = '<div class="chartwrap" data-kind="line" data-w="' + W + '" data-h="' + H + '" data-pt="' + pt + '" data-pb="' + pb + '" data-pts="' + esc(JSON.stringify(payload)) + '">';
    out += '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" role="img" aria-label="Trend chart">';
    for (var g = 0; g <= 4; g++) {
      var gv = (maxY * g) / 4, gy = Y(gv);
      out += '<line x1="' + pl + '" x2="' + (W - pr) + '" y1="' + gy + '" y2="' + gy + '" stroke="var(--line)" stroke-width="1"/>';
      out += '<text x="' + (pl - 6) + '" y="' + (gy + 4) + '" text-anchor="end">' + fmt(gv) + '</text>';
    }
    var step = Math.max(1, Math.ceil(xs.length / 6));
    xs.forEach(function (x, i) {
      if (i % step === 0 || i === xs.length - 1) {
        out += '<text x="' + X(i) + '" y="' + (H - 8) + '" text-anchor="middle">' + esc(x.slice(5)) + '</text>';
      }
    });
    series.forEach(function (s) {
      var map = {};
      s.points.forEach(function (p) { map[p.x] = p.y; });
      var d = "", started = false;
      xs.forEach(function (x, i) {
        if (map[x] == null) return;
        d += (started ? "L" : "M") + X(i).toFixed(1) + " " + Y(map[x]).toFixed(1) + " ";
        started = true;
      });
      out += '<path d="' + d + '" fill="none" stroke="' + s.color + '" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>';
      xs.forEach(function (x, i) {
        if (map[x] != null) out += '<circle cx="' + X(i).toFixed(1) + '" cy="' + Y(map[x]).toFixed(1) + '" r="3" fill="' + s.color + '"/>';
      });
    });
    out += '<line class="guide hidden-tip" x1="0" x2="0" y1="' + pt + '" y2="' + (H - pb) + '"/>';
    out += "</svg></div>";
    return out;
  }
  function barChart(groups, height) {
    // groups: [{x, a, b}] a=revenue b=expenses
    var W = 720, H = height || 240, pl = 44, pr = 12, pt = 10, pb = 26;
    if (!groups.length) return '<div class="empty">No data in this range yet.</div>';
    var maxY = 0;
    groups.forEach(function (g) { maxY = Math.max(maxY, g.a, g.b); });
    if (maxY <= 0) maxY = 1;
    var slot = (W - pl - pr) / groups.length, bw = Math.min(28, slot / 3);
    function Y(v) { return pt + (H - pt - pb) * (1 - v / maxY); }
    var bpayload = groups.map(function (gr, i) {
      var cx = pl + slot * i + slot / 2;
      return {
        x: gr.x, px: cx,
        v: [
          { label: "Revenue", color: "var(--gain)", y: gr.a, py: Y(gr.a), money: true },
          { label: "Expenses", color: "var(--loss)", y: gr.b, py: Y(gr.b), money: true },
          { label: "Profit", color: gr.a - gr.b >= 0 ? "var(--gain)" : "var(--loss)", y: gr.a - gr.b, py: null, money: true, noDot: true }
        ]
      };
    });
    var out = '<div class="chartwrap" data-kind="bar" data-w="' + W + '" data-h="' + H + '" data-pt="' + pt + '" data-pb="' + pb + '" data-pts="' + esc(JSON.stringify(bpayload)) + '">';
    out += '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" role="img" aria-label="Revenue and expenses by month">';
    for (var g = 0; g <= 4; g++) {
      var gv = (maxY * g) / 4, gy = Y(gv);
      out += '<line x1="' + pl + '" x2="' + (W - pr) + '" y1="' + gy + '" y2="' + gy + '" stroke="var(--line)"/>';
      out += '<text x="' + (pl - 6) + '" y="' + (gy + 4) + '" text-anchor="end">' + fmt(gv) + '</text>';
    }
    groups.forEach(function (gr, i) {
      var cx = pl + slot * i + slot / 2;
      out += '<rect x="' + (cx - bw - 1) + '" y="' + Y(gr.a) + '" width="' + bw + '" height="' + (H - pb - Y(gr.a)) + '" fill="var(--gain)"/>';
      out += '<rect x="' + (cx + 1) + '" y="' + Y(gr.b) + '" width="' + bw + '" height="' + (H - pb - Y(gr.b)) + '" fill="var(--loss)"/>';
      out += '<text x="' + cx + '" y="' + (H - 8) + '" text-anchor="middle">' + esc(gr.x.slice(2)) + '</text>';
    });
    out += '<line class="guide hidden-tip" x1="0" x2="0" y1="' + pt + '" y2="' + (H - pb) + '"/>';
    out += "</svg></div>";
    return out;
  }
  var GROWTH_SERIES = [
    ["impressions", "Impressions", "var(--ink)", true],
    ["clicks", "Pin clicks", "var(--pin)", true],
    ["outbound", "Outbound clicks", "#7C3AED", true],
    ["saves", "Saves", "#0E7490", true],
    ["engagement", "Engagement", "var(--gain)", true],
    ["totalAud", "Total audience", "#B45309", false],
    ["engagedAud", "Engaged audience", "#9D174D", false]
  ];
  // Shows only metrics that have data. Audience fields are daily-unique numbers: shown in hover, not drawn as summed lines.
  function growthChart(rows) {
    var drawn = [], hoverOnly = [];
    GROWTH_SERIES.forEach(function (g) {
      if (!hasSeries(rows, g[0])) return;
      var ser = { label: g[1], color: g[2], points: seriesFromMetrics(rows, g[0], true) };
      if (g[3]) drawn.push(ser); else hoverOnly.push(ser);
    });
    if (!drawn.length) return '<div class="empty">Is range mein abhi koi growth data nahi hai.</div>';
    var legend = '<div class="legend">' + drawn.map(function (d) { return '<span><i style="background:' + d.color + '"></i>' + esc(d.label) + "</span>"; }).join("") + "</div>";
    return legend + lineChart(drawn, 240, hoverOnly);
  }

  function seriesFromMetrics(rows, field) {
    var byDate = {}, seen = {};
    rows.forEach(function (r) {
      if (r[field] == null || r[field] === "") return;
      byDate[r.date] = (byDate[r.date] || 0) + num(r[field]);
      seen[r.date] = 1;
    });
    return Object.keys(byDate).sort().map(function (d) { return { x: d, y: byDate[d] }; });
  }
  // ---------- audience (unique people; NEVER summed across days) ----------
  // A record = {id, clientId, from, to, totalAud, engagedAud}. Pinterest gives one number for a whole date range.
  function audienceFor(clientId) {
    var r = range();
    var from = r.from, to = r.to;
    // exact match on the selected range wins
    var hits = state.audience.filter(function (a) {
      return (clientId === "all" || a.clientId === clientId) && a.from === from && a.to === to;
    });
    if (ui.period === "all" || ui.period === "custom" || !hits.length) {
      // for lifetime/custom (or when no exact match) use the record that best covers the range
      hits = state.audience.filter(function (a) {
        if (clientId !== "all" && a.clientId !== clientId) return false;
        if (ui.period === "all") return true;
        return a.from === from && a.to === to;
      });
    }
    return hits;
  }
  function hasSeries(rows, field) {
    for (var i = 0; i < rows.length; i++) if (rows[i][field] != null && rows[i][field] !== "") return true;
    return false;
  }
  function audienceCards(clientId) {
    var hits = audienceFor(clientId);
    if (!hits.length) {
      return '<div class="note">Is range ka audience number abhi nahi daala. Add data tab mein "Audience (range ka number)" mein daalo. (Audience unique log hote hain, isliye daily numbers jodke nahi nikaalta.)</div>';
    }
    // if several clients: we cannot add unique audiences across clients (people may overlap), so list them
    if (clientId === "all" && hits.length > 1) {
      var t = '<div class="tablewrap"><table><thead><tr><th>Client</th><th>Range</th><th>Total audience</th><th>Engaged audience</th></tr></thead><tbody>';
      hits.forEach(function (a) {
        t += "<tr><td>" + esc(clientName(a.clientId)) + "</td><td>" + esc(a.from + " to " + a.to) + "</td><td>" + fmtFull(a.totalAud) + "</td><td>" + fmtFull(a.engagedAud) + "</td></tr>";
      });
      return t + "</tbody></table></div><div class=\"note\">Clients ke audience ko jodta nahi, kyunki ek hi insaan kai clients ko dekh sakta hai.</div>";
    }

  // ---------- chart hover / touch tooltip ----------
  function fmtFull(n) { return Math.round(num(n)).toLocaleString("en-IN"); }
  function prettyDate(x) {
    if (/^\d{4}-\d{2}-\d{2}$/.test(x)) {
      var d = new Date(x + "T00:00:00Z");
      var days = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
      var mons = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
      return days[d.getUTCDay()] + ", " + d.getUTCDate() + " " + mons[d.getUTCMonth()] + " " + d.getUTCFullYear();
    }
    if (/^\d{4}-\d{2}$/.test(x)) {
      var m = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
      return m[parseInt(x.slice(5), 10) - 1] + " " + x.slice(0, 4);
    }
    return x;
  }
  function initCharts(root) {
    root.querySelectorAll(".chartwrap").forEach(function (wrap) {
      var pts;
      try { pts = JSON.parse(wrap.getAttribute("data-pts")); } catch (e) { return; }
      if (!pts || !pts.length) return;
      var W = parseFloat(wrap.getAttribute("data-w")), H = parseFloat(wrap.getAttribute("data-h"));
      var svg = wrap.querySelector("svg");
      var guide = svg.querySelector(".guide");
      var NS = "http://www.w3.org/2000/svg";
      var dots = [];
      var tip = document.createElement("div");
      tip.className = "tip hidden-tip";
      tip.setAttribute("role", "status");
      wrap.appendChild(tip);

      function clearDots() { dots.forEach(function (d) { if (d.parentNode) d.parentNode.removeChild(d); }); dots = []; }
      function hide() { tip.classList.add("hidden-tip"); guide.classList.add("hidden-tip"); clearDots(); }

      function show(clientX) {
        var box = svg.getBoundingClientRect();
        if (!box.width) return;
        var sx = (clientX - box.left) * (W / box.width);
        var best = 0, bd = Infinity;
        pts.forEach(function (p, i) { var dd = Math.abs(p.px - sx); if (dd < bd) { bd = dd; best = i; } });
        var pt = pts[best];

        guide.setAttribute("x1", pt.px); guide.setAttribute("x2", pt.px);
        guide.classList.remove("hidden-tip");
        clearDots();
        pt.v.forEach(function (v) {
          if (v.y == null || v.py == null || v.noDot) return;
          var c = document.createElementNS(NS, "circle");
          c.setAttribute("class", "hdot");
          c.setAttribute("cx", pt.px); c.setAttribute("cy", v.py); c.setAttribute("r", 5);
          c.setAttribute("fill", v.color);
          svg.appendChild(c); dots.push(c);
        });

        var h = '<div class="td">' + esc(prettyDate(pt.x)) + "</div>";
        pt.v.forEach(function (v) {
          var val = v.y == null ? "no data" : (v.money ? "Rs " + fmtFull(v.y) : fmtFull(v.y));
          h += '<div class="tr"><span><i style="background:' + v.color + '"></i>' + esc(v.label) + "</span><b>" + esc(val) + "</b></div>";
        });
        tip.innerHTML = h;
        tip.classList.remove("hidden-tip");

        // position the tooltip next to the guide line, flip near the edges
        var px = (pt.px / W) * box.width;
        var tw = tip.offsetWidth, th = tip.offsetHeight;
        var left = px + 14;
        if (left + tw > box.width) left = px - tw - 14;
        if (left < 0) left = 0;
        var top = 8;
        if (top + th > (H / W) * box.width) top = 0;
        tip.style.left = left + "px";
        tip.style.top = top + "px";
      }

      wrap.addEventListener("mousemove", function (e) { show(e.clientX); });
      wrap.addEventListener("mouseleave", hide);
      wrap.addEventListener("touchstart", function (e) { if (e.touches[0]) show(e.touches[0].clientX); }, { passive: true });
      wrap.addEventListener("touchmove", function (e) { if (e.touches[0]) show(e.touches[0].clientX); }, { passive: true });
      wrap.addEventListener("touchend", function () { setTimeout(hide, 1800); });
    });
  }

  // ---------- upsert (dedupe) ----------
  // growth: one row per client + date. finance: identical type+date+amount+source is a duplicate.
  var METRIC_FIELDS = ["impressions", "clicks", "outbound", "saves", "engagement", "totalAud", "engagedAud"];
  // rec only carries the fields that were provided (others are undefined). Provided fields overwrite;
  // missing fields keep their old value, so separate exports (impressions, saves, audience...) can be merged.
  function upsertMetric(rec) {
    for (var i = 0; i < state.metrics.length; i++) {
      var m = state.metrics[i];
      if (m.clientId === rec.clientId && m.date === rec.date) {
        METRIC_FIELDS.forEach(function (f) { if (rec[f] !== undefined) m[f] = rec[f]; });
        return "updated";
      }
    }
    var fresh = { id: rec.id, clientId: rec.clientId, date: rec.date };
    METRIC_FIELDS.forEach(function (f) { if (rec[f] !== undefined) fresh[f] = rec[f]; });
    state.metrics.push(fresh);
    return "added";
  }
  function addFinanceUnique(rec) {
    for (var i = 0; i < state.finance.length; i++) {
      var f = state.finance[i];
      if (f.type === rec.type && f.date === rec.date && num(f.amount) === num(rec.amount) && (f.source || "Other") === (rec.source || "Other")) {
        return "skipped";
      }
    }
    state.finance.push(rec);
    return "added";
  }

    });
    root.querySelector("#addAud").addEventListener("click", function () {

      var ta = String(root.querySelector("#aTotal").value).trim(), ea = String(root.querySelector("#aEng").value).trim();
      if (ta === "" && ea === "") { root.querySelector("#aTotal").focus(); return; }
      var hit = null;
      state.audience.forEach(function (a) { if (a.clientId === cid && a.from === from && a.to === to) hit = a; });
      if (!hit) { hit = { id: uid(), clientId: cid, from: from, to: to }; state.audience.push(hit); }
      if (ta !== "") hit.totalAud = num(ta);
      if (ea !== "") hit.engagedAud = num(ea);

      });
    });
    root.querySelector("#addFin").addEventListener("click", function () {
      var amt = num(root.querySelector("#fAmt").value);
      if (amt <= 0) { root.querySelector("#fAmt").focus(); return; }
      var fres = addFinanceUnique({
        id: uid(), type: root.querySelector("#fType").value,
        date: root.querySelector("#fDate").value || todayStr(),
        amount: amt, source: root.querySelector("#fSrc").value.trim() || "Other"
      });
      scheduleSave(); renderAll();
      if (fres === "skipped") setStatus("Ye same entry pehle se hai, skip ki");
    });
    root.querySelectorAll("[data-delclient]").forEach(function (b) {
      b.addEventListener("click", function () {
        var id = b.getAttribute("data-delclient");
        if (!confirm("Is client aur uski saari growth entries delete karni hain?")) return;
        state.clients = state.clients.filter(function (c) { return c.id !== id; });
        state.metrics = state.metrics.filter(function (m) { return m.clientId !== id; });
        state.audience = state.audience.filter(function (a) { return a.clientId !== id; });
        scheduleSave(); renderAll();
      });
    });
    root.querySelectorAll("[data-delmetric]").forEach(function (b) {
      b.addEventListener("click", function () {
        var id = b.getAttribute("data-delmetric");
        state.metrics = state.metrics.filter(function (m) { return m.id !== id; });
        scheduleSave(); renderAll();
      });
    });
    root.querySelectorAll("[data-delfin]").forEach(function (b) {
      b.addEventListener("click", function () {
        var id = b.getAttribute("data-delfin");
        state.finance = state.finance.filter(function (f) { return f.id !== id; });
        scheduleSave(); renderAll();
      });
    });
    root.querySelector("#csvMetrics").addEventListener("change", function (e) { importCsv(e.target.files[0], "metrics"); e.target.value = ""; });
    root.querySelector("#csvFin").addEventListener("change", function (e) { importCsv(e.target.files[0], "finance"); e.target.value = ""; });
    root.querySelector("#expMetrics").addEventListener("click", function () { exportCsv("metrics"); });
    root.querySelector("#expFin").addEventListener("click", function () { exportCsv("finance"); });
  }

  // ---------- CSV ----------
  function parseCsv(text) {
    var rows = [], row = [], cur = "", q = false;
    for (var i = 0; i < text.length; i++) {
      var ch = text[i];
      if (q) {
        if (ch === '"' && text[i + 1] === '"') { cur += '"'; i++; }
        else if (ch === '"') q = false;
        else cur += ch;
      } else if (ch === '"') q = true;
      else if (ch === ",") { row.push(cur); cur = ""; }
      else if (ch === "\n" || ch === "\r") {
        if (ch === "\r" && text[i + 1] === "\n") i++;
        row.push(cur); cur = "";
        if (row.length > 1 || row[0] !== "") rows.push(row);
        row = [];
      } else cur += ch;
    }
    if (cur !== "" || row.length) { row.push(cur); rows.push(row); }
    return rows;
  }
  function csvCell(v) {
    v = String(v == null ? "" : v);
    return /[",\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
  }
  function normDate(s) {
    s = String(s || "").trim();
    var m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
    if (m) return m[1] + "-" + ("0" + m[2]).slice(-2) + "-" + ("0" + m[3]).slice(-2);
    var d = new Date(s);
    return isNaN(d.getTime()) ? "" : d.toISOString().slice(0, 10);
  }
  function importCsv(file, kind) {
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      var rows = parseCsv(String(reader.result));
      if (rows.length < 2) { alert("CSV mein data rows nahi mile."); return; }
      var head = rows[0].map(function (h) { return h.trim().toLowerCase(); });
      function col(name) { return head.indexOf(name); }
      var added = 0, updated = 0, skipped = 0;
      if (kind === "metrics") {
        var ci = col("client"), di = col("date");
        if (ci < 0 || di < 0) { alert("CSV mein 'client' aur 'date' columns chahiye."); return; }
        rows.slice(1).forEach(function (r) {
          var name = (r[ci] || "").trim(), date = normDate(r[di]);
          if (!name || !date) { skipped++; return; }
          var client = state.clients.filter(function (c) { return c.name.toLowerCase() === name.toLowerCase(); })[0];
          if (!client) { client = { id: uid(), name: name }; state.clients.push(client); }
          var rec = { id: uid(), clientId: client.id, date: date };
          var map = { impressions: "impressions", clicks: "clicks", outbound: "outbound clicks", saves: "saves", engagement: "engagement", totalAud: "total audience", engagedAud: "engaged audience" };
          var any = false;
          Object.keys(map).forEach(function (k) {
            var ix = col(map[k]);
            if (ix < 0) ix = col(k.toLowerCase());
            if (ix >= 0 && String(r[ix] == null ? "" : r[ix]).trim() !== "") { rec[k] = num(r[ix]); any = true; }
          });
          if (!any) { skipped++; return; }
          var mres = upsertMetric(rec);
          if (mres === "updated") updated++; else added++;
        });
      } else {
        var ti = col("type"), dt = col("date"), ai = col("amount");
        if (ti < 0 || dt < 0 || ai < 0) { alert("CSV mein 'type', 'date', 'amount' columns chahiye."); return; }
        rows.slice(1).forEach(function (r) {
          var type = (r[ti] || "").trim().toLowerCase(), date = normDate(r[dt]), amt = num(r[ai]);
          if ((type !== "revenue" && type !== "expense") || !date || amt <= 0) { skipped++; return; }
          var fr = addFinanceUnique({ id: uid(), type: type, date: date, amount: amt, source: (r[col("source")] || "Other").trim() || "Other" });
          if (fr === "skipped") skipped++; else added++;
        });
      }
      scheduleSave(); renderAll();
      alert(added + " nayi rows add hui, " + updated + " purani update hui, " + skipped + " skip hui (duplicate ya galat).");
    };
    reader.readAsText(file);
  }
  function exportCsv(kind) {
    var lines;
    if (kind === "metrics") {
      lines = ["client,date,impressions,clicks,outbound clicks,saves,engagement,total audience,engaged audience"];
      state.metrics.forEach(function (m) {
        lines.push([clientName(m.clientId), m.date, m.impressions, m.clicks, m.outbound, m.saves, m.engagement, m.totalAud, m.engagedAud].map(function (v) { return v == null ? "" : v; }).map(csvCell).join(","));
      });
    } else {
      lines = ["type,date,amount,source"];
      state.finance.forEach(function (f) {
        lines.push([f.type, f.date, f.amount, f.source].map(csvCell).join(","));
      });
    }
    var data = lines.join("\n");
    var filename = (kind === "metrics" ? "client-growth" : "finance") + "-" + todayStr() + ".csv";
    try {
      var blob = new Blob([data], { type: "text/csv;charset=utf-8" });
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = filename;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
    } catch (e) { setStatus("Download failed"); }
  }

  // ---------- render / tabs ----------
  function renderAll() {
    renderOverview(); renderClients(); renderBusiness(); renderData();
    initCharts(document);
  }
  // ---------- roles, routing, 404 ----------
  var ROLE = null;
  var ALL_TABS = ["overview", "clients", "business", "data", "team"];
  var TABS = { admin: ALL_TABS, employee: ["team"] };
  function allowed(t) { return !!ROLE && TABS[ROLE].indexOf(t) > -1; }

  function route() {
    if (!ROLE) return;
    var t = (location.hash || "").replace(/^#\/?/, "");
    if (!t) t = ROLE === "admin" ? "overview" : "team";
    var ok = allowed(t);
    ALL_TABS.forEach(function (x) {
      var el = document.getElementById("tab-" + x);
      if (el) el.classList.toggle("hidden", !(ok && x === t));
    });
    document.querySelectorAll("#tabs button").forEach(function (b) {
      b.setAttribute("aria-selected", ok && b.getAttribute("data-tab") === t ? "true" : "false");
    });
    document.getElementById("view-404").classList.toggle("hidden", ok);
    if (ok) {
      ui.tab = t;
      if (t === "team" && window.teamTabOpen) window.teamTabOpen(ROLE);
    }
  }
  document.getElementById("tabs").addEventListener("click", function (e) {
    var b = e.target.closest("button[data-tab]");
    if (!b) return;
    var h = "#/" + b.getAttribute("data-tab");
    if (location.hash === h) route(); else location.hash = h;
  });
  window.addEventListener("hashchange", route);

  // ---------- login gate ----------
  function setKey(k) {
    try { if (k) localStorage.setItem(KEY_LS, k); else localStorage.removeItem(KEY_LS); } catch (e) {}
  }
  function tapi(action, body) {
    return fetch("/api/team", {
      method: "POST", credentials: "same-origin",
      headers: { "Content-Type": "application/json", "x-dashboard-key": getKey() },
      body: JSON.stringify(Object.assign({ action: action }, body || {}))
    }).then(function (r) { return r.json().then(function (d) { return { ok: r.ok, status: r.status, d: d }; }); });
  }
  function checkAdmin() {
    return fetch("/api/state", { headers: apiHeaders() })
      .then(function (r) { if (r.status === 401) return "bad"; return r.ok ? "ok" : "err"; })
      .catch(function () { return "err"; });
  }
  function gateView(msg) {
    document.getElementById("app").classList.add("hidden");
    var g = document.getElementById("gate");
    g.classList.remove("hidden");
    g.innerHTML = '<div style="max-width:360px;margin:12vh auto 0">' +
      '<h1>Ops Dashboard</h1>' +
      '<p class="note">Employee: email + password. Admin: email khali chhodo, sirf admin password daalo.</p>' +
      '<label class="note">Email (employee)</label><input id="g-e" type="email" autocapitalize="none" style="width:100%">' +
      '<label class="note">Password</label><input id="g-p" type="password" style="width:100%">' +
      '<p><button class="btn primary" id="g-go">Login</button></p>' +
      '<div class="note" id="g-er" style="color:var(--pin)"></div></div>';
    g.querySelector("#g-er").textContent = msg || "";
    var btn = g.querySelector("#g-go");
    function submit() {
      var em = g.querySelector("#g-e").value.trim(), pw = g.querySelector("#g-p").value, p;
      if (!pw) return;
      btn.disabled = true;
      if (!em) {
        setKey(pw);
        p = checkAdmin().then(function (s) {
          if (s === "ok") return { admin: true };
          setKey("");
          throw new Error(s === "bad" ? "Password galat hai." : "Server se connect nahi hua.");
        });
      } else {
        setKey("");
        p = tapi("login", { email: em, password: pw }).then(function (x) {
          if (x.status === 403) throw new Error("Is device ka access band hai.");
          if (!x.ok) throw new Error("Email ya password galat hai.");
          return tapi("boot");
        }).then(function (x) {
          if (!x.ok || x.d.admin) throw new Error("Login nahi hua, dobara try karo.");
          return x.d;
        });
      }
      p.then(enter).catch(function (err) { gateView(err.message); });
    }
    btn.onclick = submit;
    g.addEventListener("keydown", function (e) { if (e.key === "Enter") submit(); });
  }
  function enter(d) {
    ROLE = d.admin ? "admin" : "employee";
    var g = document.getElementById("gate");
    g.classList.add("hidden");
    g.innerHTML = "";
    document.getElementById("app").classList.remove("hidden");
    document.getElementById("logout").classList.remove("hidden");
    if (ROLE === "employee") {
      // other tabs are removed from the page completely, data never loads
      ["overview", "clients", "business", "data"].forEach(function (t) {
        var s = document.getElementById("tab-" + t); if (s) s.remove();
        var b = document.querySelector('#tabs button[data-tab="' + t + '"]'); if (b) b.remove();
      });
      document.querySelector("header h1").textContent = "GrowMyPin Studio";
      setStatus(d.email || "");
    } else {
      startAdmin();
    }
    route();
  }
  document.getElementById("logout").addEventListener("click", function (e) {
    e.preventDefault();
    tapi("logout").catch(function () {}).then(function () {
      setKey("");
      if (ROLE === "admin" && store) { try { localStorage.removeItem(LS_KEY); } catch (x) {} }
      location.hash = "";
      location.reload();
    });
  });
  function bootGate() {
    var haveKey = !!getKey();
    (haveKey ? checkAdmin() : Promise.resolve("none")).then(function (s) {
      if (s === "ok") return enter({ admin: true });
      if (s === "bad") setKey("");
      return tapi("boot").then(function (x) {
        if (x.ok && !x.d.admin) return enter(x.d);
        gateView();
      });
    }).catch(function () { gateView("Server se connect nahi hua."); });
  }

  // ---------- admin boot (runs only after admin is verified) ----------
  function startAdmin() {
    loadState(lsRead());
    renderAll();
    setStatus(state.clients.length || state.metrics.length || state.finance.length ? "Loaded from this browser" : "Empty. Start from the Add data tab.");
    cloudBoot();
  }

  function cloudBoot() {
    var key = getKey();
    if (!key) {
      key = window.prompt("Dashboard password:") || "";
      if (!key) { setStatus("Password required for cloud sync. Using this browser."); return; }
      try { localStorage.setItem(KEY_LS, key); } catch (e) {}
    }
    fetch("/api/state", { headers: apiHeaders() }).then(function (r) {
      if (r.status === 401) {
        try { localStorage.removeItem(KEY_LS); } catch (e) {}
        setStatus("Wrong password. Reload and try again.");
        return null;
      }
      if (!r.ok) throw new Error("http " + r.status);
      return r.json();
    }).then(function (res) {
      if (!res) return;
      store = true;
      var cloud = res.data;
      if (cloud && typeof cloud === "object") {
        var hasLocal = state.clients.length || state.metrics.length || state.finance.length;
        var cloudCount = (cloud.metrics || []).length + (cloud.finance || []).length;
        var localCount = state.metrics.length + state.finance.length;
        if (!hasLocal || cloudCount >= localCount) { loadState(cloud); lsWrite(); renderAll(); }
      }
      setStatus("Cloud sync on");
      if (state.clients.length || state.metrics.length || state.finance.length) scheduleSave();
    }).catch(function () { setStatus("Cloud sync unavailable. Using this browser."); });
  }
  bootGate();
})();
</script>
